name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      - name: Compile and run tests
        run: ./mvnw -B --no-transfer-progress verify

      - name: Build self-contained app image
        run: ./mvnw -B --no-transfer-progress javafx:jlink

      - name: Resolve release tag
        id: release
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Stage release assets
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/TagForceDeckEditor-*.jar "dist/TagForceDeckEditor-${VERSION}.jar"
          cp target/app.zip "dist/TagForceDeckEditor-${VERSION}-linux-x64.zip"
          ls -lh dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" dist/* \
            --title "Tag Force 5 Deck Editor ${TAG}" \
            --generate-notes
