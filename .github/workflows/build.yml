name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      - name: Compile and run tests
        run: ./mvnw -B --no-transfer-progress verify

      - name: Build self-contained app image
        run: ./mvnw -B --no-transfer-progress javafx:jlink

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: TagForceDeckEditor-jar
          path: target/*.jar
          if-no-files-found: error

      - name: Upload runnable app image
        uses: actions/upload-artifact@v4
        with:
          name: TagForceDeckEditor-linux-x64
          path: target/app.zip
          if-no-files-found: error
